global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']  # métricas da app exportadas pelo collector
  - job_name: 'otel-collector-internal'
    static_configs:
      - targets: ['otel-collector:8888']  # métricas internas do próprio collector
